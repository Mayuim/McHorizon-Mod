# Builds the mod on every push. Download the jar from the run's "Artifacts" section.
name: build
on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
      - name: Build
        # Retry once: Fabric's maven occasionally drops connections.
        run: ./gradlew build || ./gradlew build
      - name: Check mixin targets exist in Minecraft
        run: python3 scripts/check_mixin_targets.py
      - name: Dump signatures (temporary)
        run: python3 scripts/dump_sigs.py net.minecraft.client.renderer.entity.player.AvatarRenderer net.minecraft.client.renderer.ItemInHandRenderer net.minecraft.client.renderer.block.model.ItemTransform > /tmp/code.txt; grep -n "" /tmp/code.txt | sed -n "1,99999p" | grep -A140 -E "void (renderRightHand|renderLeftHand|renderHand|renderPlayerArm|apply)\\(" | head -700 || true
      - name: Upload mod jar
        uses: actions/upload-artifact@v7
        with:
          name: mchorizon-mc1.21.11
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
